---
name: verify

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

jobs:
  resolve-versions:
    name: resolve go versions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      GO_MINOR_VERSION_STABLE: ${{ steps.versions.outputs.GO_MINOR_VERSION_STABLE }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Resolve Go versions
        id: versions
        uses: carabiner-dev/actions/go/versions@94f29392187fe5082d1195a7d4cae3a7ddf09d9c

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: resolve-versions

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ needs.resolve-versions.outputs.GO_MINOR_VERSION_STABLE }}
          check-latest: true
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.11
